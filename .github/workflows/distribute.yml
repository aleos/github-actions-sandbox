name: distribute

on:
  push:
    branches:
      - 'main'
      - 'release'
      - 'dev'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    branches:
      - '**'
  workflow_call:
    inputs:
      scheme:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select the environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - stage
          - preprod
          - production


env:
  DEVELOPER_DIR: /Applications/Xcode_14.3.1.app/Contents/Developer

jobs:
  detect-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.detect-env.outputs.environment }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Detect environment
        id: detect-env
        uses: ./.github/actions/detect-environment

  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Generate Changelog
        id: changelog
        uses: ./.github/actions/generate-changelog
        with:
          changelog_dir: ${{ github.workspace }}/Changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            
  archive-artifacts:
    runs-on: ubuntu-latest
    needs: detect-environment
    environment: ${{ needs.detect-environment.outputs.environment }}
    outputs:
      archive-path: ${{ steps.archive.outputs.archive-path }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate build number
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{secrets.github_token}}
          prefix: 0.2.6
      - name: Print new build number
        run: echo "Build number is $BUILD_NUMBER"
        
      - name: Distribute Test
        env:
          SOME_ENV_VAR: ${{ secrets.Some_SECREt }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT: ${{ toJSON(github.event) }}
          SAFE_CHANGELOG_PATH: ${{ env.SAFE_CHANGELOG_PATH }}
        run: |
          echo "Test logs"

          echo "GITHUB_BASE_REF is ${GITHUB_BASE_REF}"
          echo "github.base_ref is ${{ github.base_ref }}"
          echo "github.ref_name is ${{ github.ref_name }}"
          echo "needs.prepare.outputs.environment is ${{ needs.detect-environment.outputs.environment }}"

          echo "secrets.PROFILE_ADHOC_BASE64 is ${{ secrets.PROFILE_ADHOC_BASE64 }}"
          echo "vars.SCHEME is ${{ vars.SCHEME }}"

          echo "SCHEME is ${SCHEME}"
          echo "CURRENT_PROJECT_VERSION is ${CURRENT_PROJECT_VERSION}"
          echo "GITHUB_RUN_ID is ${GITHUB_RUN_ID}"
          echo "github.run_number is ${{ github.run_number }}"
          echo "github.run_attempt is ${{ github.run_attempt }}"
          echo "FILE_NAME is ${FILE_NAME}"
          echo "SOME_ENV_VAR var is ${SOME_ENV_VAR}"
          echo "NAME2 is ${NAME2}, NAME2 length is `echo ${NAME2} | wc -m`"

      - name: Archive Artifacts
        id: archive
        run: |
          echo "Archiving artifacts for ${{ needs.detect-environment.outputs.environment }} environment"
          mkdir -p artifacts
          echo "data" > artifacts/file.txt
          echo "archive-path=artifacts" >> $GITHUB_OUTPUT

  upload-artifacts:
    runs-on: ubuntu-latest
    needs: [detect-environment, archive-artifacts, generate-changelog]
    environment: ${{ needs.detect-environment.outputs.environment }}
    steps:
      - name: Upload Artifacts
        run: |
          echo "Uploading artifacts from ${{ needs.archive-artifacts.outputs.archive-path }} for ${{ env.environment }} environment"
